name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: ./gradlew --no-daemon check bootJar
      - run: node --test src/test/*.test.mjs

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: Validate chart and render deployment variants
        run: |
          helm lint charts/flink-portal --strict
          helm template flink-portal charts/flink-portal --namespace flink-portal > /dev/null
          helm template flink-portal charts/flink-portal --namespace flink-portal \
            --set 'portal.namespaces={team-a,team-b}' \
            --set ingress.enabled=true --set 'ingress.hosts[0]=portal.example.com' > /dev/null
          helm template flink-portal charts/flink-portal --namespace flink-portal \
            --set portal.operatorMonitor.enabled=true \
            --set 'portal.namespaces={team-a,team-b}' \
            --set 'portal.operatorMonitor.namespaces={flink-operator,team-a}' > /dev/null
          helm package charts/flink-portal --destination dist

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=flink-portal
          cache-to: type=gha,mode=max,scope=flink-portal
